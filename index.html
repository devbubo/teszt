<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teszt projekt</title>
  <style>
    :root { --bg: #f6f4ef; --fg: #1d1d1b; --accent: #d9622b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161614; --fg: #f2efe8; --accent: #f08a50; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif; padding: 16px;
    }
    main { text-align: center; max-width: 420px; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p { opacity: .8; line-height: 1.5; }
    button {
      margin-top: 1.5rem; padding: .8rem 1.6rem; font-size: 1rem;
      border: 0; border-radius: 999px; background: var(--accent); color: #fff;
      cursor: pointer;
    }
    #szamlalo { font-size: 3rem; font-weight: 700; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Szia! 👋</h1>
    <p>Ez az első teszt projektem a GitHubon. A Claude készítette és töltötte fel.</p>
    <div id="szamlalo">0</div>
    <button id="gomb">Nyomj meg!</button>
  </main>
  <script>
    let n = 0;
    document.getElementById('gomb').addEventListener('click', () => {
      n++;
      document.getElementById('szamlalo').textContent = n;
    });
  </script>
</body>
</html>
